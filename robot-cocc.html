document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

for(let i=0;i<PATH.length;i++){const a=PATH[i],b=PATH[(i+1)%PATH.length];for(let k=0;k<14;k++){const t=Math.random();const p=a.clone().lerp(b,t);p.x+=(Math.random()-.5)*0.34;p.z+=(Math.random()-.5)*0.34;\n  const d=new THREE.Mesh(new THREE.CircleGeometry(0.008+Math.random()*0.012,8),dustMat);d.rotation.x=-Math.PI/2;d.position.set(p.x,0.006,p.z);dust.add(d);}}})();\nfunction resetDust(){dust.children.forEach(d=>d.visible=true);}\n\n/* ---------- face + body screen drawing ---------- */\nconst R={mood:'happy',ring:'#7FE3D2',screen:'idle',data:{},t0:0};\nfunction drawFace(t){\n  const g=face.ctx,W=512,H=340; g.clearRect(0,0,W,H);\n  rr(g,6,6,W-12,H-12,110); g.fillStyle='#12202A'; g.fill();\n  if(R.mood==='alert'){g.lineWidth=12;g.strokeStyle='#E0553C';g.stroke();}\n  const blink=(Math.sin(t*0.9)>0.985)?0.12:1;\n  const cx1=W/2-92,cx2=W/2+92,cy=H/2-6;\n  g.lineCap='round';\n  const col={happy:'#7FE3D2',listen:'#7FE3D2',alert:'#FFB4A3',sleep:'#5FA79A',love:'#F2B45A'}[R.mood]||'#7FE3D2';\n  g.fillStyle=col;g.strokeStyle=col;\n  if(R.mood==='happy'){g.lineWidth=26;[cx1,cx2].forEach(x=>{g.beginPath();g.arc(x,cy+26,44,Math.PI*1.18,Math.PI*1.82);g.stroke();});}\n  else if(R.mood==='sleep'){g.lineWidth=18;[cx1,cx2].forEach(x=>{g.beginPath();g.moveTo(x-40,cy+6);g.lineTo(x+40,cy+6);g.stroke();});}\n  else if(R.mood==='love'){[cx1,cx2].forEach(x=>{g.beginPath();const s=1.2;g.moveTo(x,cy+34*s);g.bezierCurveTo(x-60*s,cy-6*s,x-26*s,cy-44*s,x,cy-16*s);g.bezierCurveTo(x+26*s,cy-44*s,x+60*s,cy-6*s,x,cy+34*s);g.fill();});}\n  else{const r=R.mood==='alert'?44:38;[cx1,cx2].forEach(x=>{g.save();g.translate(x,cy);g.scale(1,blink);g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.fill();g.restore();});\n    if(R.mood==='listen'){g.lineWidth=10;for(let i=0;i<5;i++){const h=14+Math.abs(Math.sin(t*6+i))*34;g.beginPath();g.moveTo(W/2-60+i*30,cy+110-h/2);g.lineTo(W/2-60+i*30,cy+110+h/2);g.stroke();}}}\n  face.t.needsUpdate=true;\n}\nfunction wrap(g,text,x,y,maxW,lh){const words=text.split(' ');let line='';for(const w of words){const test=line?line+' '+w:w;if(g.measureText(test).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w;}else line=test;}if(line)g.fillText(line,x,y);return y+lh;}\nfunction drawBody(t){\n  const g=body.ctx,W=512,H=900; g.fillStyle='#12202A';g.fillRect(0,0,W,H);\n  g.textAlign='center';g.textBaseline='alphabetic';\n  const d=R.data, s=R.screen;\n  const F=(w,sz)=>`${w} ${sz}px \"Be Vietnam Pro\", system-ui, sans-serif`;\n  if(s==='idle'||s==='studio'){\n    g.fillStyle='#7FE3D2';g.font=F(800,96);g.fillText('COCC',W/2,H/2-20);\n    g.fillStyle='#9FC2BA';g.font=F(500,34);g.fillText('Bạn của ông bà',W/2,H/2+44);\n  }else if(s==='morning'){\n    g.fillStyle='#EAF4F1';g.font=F(700,52);wrap(g,'Chào bà Tư buổi sáng!',W/2,150,440,62);\n    g.fillStyle='#F2B45A';g.beginPath();g.arc(W/2,360,70,0,Math.PI*2);g.fill();\n    g.fillStyle='#EAF4F1';g.font=F(800,90);g.fillText('29°',W/2,540);\n    g.fillStyle='#9FC2BA';g.font=F(500,34);wrap(g,'Nắng nhẹ · hợp đi bộ công viên nội khu',W/2,620,440,44);\n  }else if(s==='med'){\n    g.fillStyle='#9FC2BA';g.font=F(600,34);g.fillText('07:30 · thuốc huyết áp',W/2,110);\n    g.fillStyle='#EAF4F1';g.font=F(700,54);const y=wrap(g,'Bà Tư ơi, tới giờ uống thuốc rồi',W/2,210,440,66);\n    g.fillStyle='#E88A6A';g.beginPath();g.ellipse(W/2-40,y+60,40,22,0.4,0,Math.PI*2);g.fill();g.fillStyle='#F2D57A';g.beginPath();g.ellipse(W/2+44,y+60,40,22,-0.4,0,Math.PI*2);g.fill();\n    rr(g,50,H-190,W-100,120,28);g.fillStyle=d.done?'#2B4752':'#2FA383';g.fill();\n    g.fillStyle='#fff';g.font=F(800,44);g.fillText(d.done?'Đã ghi lại ✓':'Bà uống rồi',W/2,H-115);\n  }else if(s==='fall'){\n    if(!d.sent){\n      g.fillStyle='#FFB4A3';g.font=F(700,52);const y=wrap(g,'Bà Tư ơi, bà có sao không?',W/2,170,440,64);\n      g.fillStyle='#FFD27A';g.font='700 200px \"JetBrains Mono\", monospace';g.fillText(String(Math.max(0,d.count??10)),W/2,y+230);\n      g.fillStyle='#9FC2BA';g.font=F(500,32);wrap(g,'Không nghe trả lời thì COCC báo con và bảo vệ',W il(L/0.05));for(let i=0;i<=n;i++){const t=i/n;if(skipStart&&t*L<0.12)continue;if(!freeAt(a.x+(b.x-a.x)*t,a.z+(b.z-a.z)*t))return false;}return true;}\nfunction plan(start,goal){\n  const st=new THREE.Vector3(start.x,0,start.z), gl=goal.clone().setY(0);\n  if(segFree(st,gl,true)) return [gl];\n  const nodes=[st];for(let x=-2.9;x<=3.7;x+=0.3)for(let z=-2.3;z<=3.2;z+=0.3){if(freeAt(x,z))nodes.push(new THREE.Vector3(x,0,z));}\n  nodes.push(gl);const N=nodes.length,G=N-1;\n  const dist=new Array(N).fill(Infinity),prev=new Array(N).fill(-1),done=new Array(N).fill(false);dist[0]=0;\n  for(;;){let u=-1,best=Infinity;for(let i=0;i<N;i++)if(!done[i]&&dist[i]<best){best=dist[i];u=i;}\n    if(u<0||u===G)break;done[u]=true;\n    for(let v=0;v<N;v++){if(done[v]||v===u)continue;const d=nodes[u].distanceTo(nodes[v]);\n      const lim=(u===0||v===G)?0.75:0.45; if(d>lim)continue;\n      if(dist[u]+d<dist[v]&&segFree(nodes[u],nodes[v],u===0)){dist[v]=dist[u]+d;prev[v]=u;}}}\n  if(prev[G]<0) return [gl];\n  const P=[];for(let i=G;i>=0;i=prev[i]){P.unshift(nodes[i]);if(i===0)break;}\n  const out=[];let i=0;while(i<P.length-1){let j=P.length-1;while(j>i+1&&!segFree(P[i],P[j],i===0))j--;out.push(P[j]);i=j;}\n  return out;\n}\nconst SIDE=V(-1.8,0,0.2); // beside the armchair, to bà's right\nfunction setCam(p,t){S.camPos=p;S.camTarget=t;}\nconst scenes=[\n {n:'Xem máy',l:'COCC 360°',time:'Thông số thiết kế',title:'COCC: robot sống cùng ông bà',\n  text:'Cao 1,15 m. Mặt ngang tầm mắt người đang ngồi, mâm ngang tầm tay. Bo tròn mọi cạnh, di chuyển chậm trong nhà.',\n  extra:`<dl class=\"specs\"><dt>Chiều cao<\u002Fdt><dd>1.150 mm<\u002Fdd><dt>Đường kính đế<\u002Fdt><dd>412 mm<\u002Fdd><dt>Mâm<\u002Fdt><dd>Ø 400 mm · cao 700 mm<\u002Fdd><dt>Màn hình mặt<\u002Fdt><dd>ngang 1.000 mm<\u002Fdd><dt>Pin, tốc độ, tải mâm<\u002Fdt><dd>[theo hãng đối tác]<\u002Fdd><dt>Ngôn ngữ<\u002Fdt><dd>tiếng Việt<\u002Fdd><\u002Fdl>`,\n  enter(){S.studio=true;S.goal=V(0,0,0);S.look=null;S.heading=0.35;R.mood='happy 10; every(()=>{n--;R.data.count=n;if(n<=0){clearTimers();R.data.sent=true;toast('Mẹ có thể đã ngã','Căn A-12-05 · bà không trả lời. Bảo vệ đang lên','15:01',true);say('Con đã báo anh Minh. Bà nằm yên nha, có người lên ngay.');}},1000);},2300);}},\n {n:'20:00',l:'Gọi video cho con',time:'20:00 · gọi video',title:'Một câu nói là gọi được cho con',\n  text:'Bà nói \"gọi anh Minh\". Màn hình thân quay về phía ghế, cháu ở xa cũng chào bà được mỗi tối.',\n  enter(){R.mood='love';R.ring='#7FE3D2';R.screen='call';R.t0=clock.getElapsedTime();S.goal=SIDE.clone();S.look=V(0.2,0,1.6);setCam(V(1.3,1.75,2.3),V(-1.55,0.62,-0.35));\n    later(()=>toast('Mẹ đang gọi video','Từ COCC ở căn A-12-05','20:00'),1200);say('Bà ơi, con gọi anh Minh nha.');}},\n {n:'02:00',l:'Ban đêm: dọn nhà',time:'22:10 → 02:47 · bà đã ngủ',title:'Bà ngủ, COCC dọn nhà rồi báo con: an toàn',\n  text:'Bà lên giường, COCC chuyển sang chế độ êm và dọn sàn phòng khách. Dọn xong, COCC về đế sạc và nhắn anh Minh: đêm nay mẹ ngủ yên.',\n  enter(){S.night=true;S.cleaning=true;R.mood='sleep';R.ring='#3E7F8F';R.screen='night';R.data={pct:0};\n    baSeat.visible=false;baSleep.visible=true;dust.visible=true;resetDust();\n    S.patrol=PATH.map(p=>p.clone());S.pi=0;S.goal=S.patrol[0].clone();S.look=null;setCam(V(3.9,3.1,3.6),V(0.9,0.2,-0.4));\n    later(()=>toast('Mẹ đã đi ngủ','Mẹ lên giường lúc 22:10. COCC chuyển sang chế độ đêm','22:10'),900);}}\n];\n\n/* ---------- timers, speech, toast ---------- */\nlet timers=[];\nfunction later(f,ms){timers.push(setTimeout(f,ms));}\nfunction every(f,ms){timers.push(setInterval(f,ms));}\nfunction clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t);});timers=[];}\nlet voice=false;\nfunction say(text){if(!voice)return;try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.rate=.95;const v=s.getVoices().find(v=>/^vi/i.test(v.lang));if(v)u.voice=v;s.speak(u);}catch(e){}}\nlet toastT;\nfunction toast(title,body,time,crit){const el=$('#toast');$('#toastTitle').textContent=title;$('#toastBody').textContent=body;$('#toastTime').textContent=time||'';el.classList.toggle('crit',!!crit);el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),crit?9000:4200);}\n\n/* ---------- UI ---------- */\nlet cur=0;\nfunction renderChips(){const c=$('#chips');c.innerHTML='';scenes.forEach((s,i)=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-current',i===cur);b.innerHTML=`<span class=\"n\">${s.n}<\u002Fspan><span class=\"l\">${s.l}<\u002Fspan>`;b.onclick=()=>go(i);c.appendChild(b);});}\nfunction go(i){\n  clearTimers();try{speechSynthesis.cancel();}catch(e){}\n  $('#toast').classList.remove('show');\n  cur=i;const s=scenes[i];\n  // reset world\n  S.studio=false;S.night=false;S.cleaning=false;S.patrol=null;S.fall=0;S.spin=false;baSleep.visible=false;dust.visible=false;brushes.forEach(b=>b.visible=false);\n  baSeat.visible=true;baStand.visible=false;baStand.rotation.set(0,0,0);cup.visible=false;pill.visible=false;R.data={};\n  s.enter();\n  room.visible=!S.studio;podium.visible=S.studio;\n  if(S.studio){robot.position.set(0,0,0);}\n  else if(robot.position.length()<0.01){robot.position.copy(DOCK);S.heading=0;}\n  $('#bSpin').setAttribute('aria-pressed',S.spin);\n  $('#capTime').textContent=s.time;$('#capTitle').textContent=s.title;$('#capText').textContent=s.text;$('#capExtra').innerHTML=s.extra||'';\n  const acts=$('#capActs');acts.innerHTML='';(s.acts||[]).forEach(([l,f])=>{const b=document.createElement('button');b.className='act';b.textContent=l;b.onclick=()=>{f();b.disabled=true;b.className='act ghost';};acts.appendChild(b);});\n  renderChips();\n}\nlet showLabels=true;\n$('#bLabels').onclick=e=>{showLabels=!showLabels;e.currentTarget.setAttribute('aria-pressed',showLabels);};\n$('#bSpin').onclick=e=>{S.spin=!S.spin;e.currentTarget.setAttribute('aria-pressed',S.spin);};\n$('#bVoice').onclick=e=>{voice=!voice;e.currentTarget.setAttribute('aria-pressed',voice);};\ncontrols.addEventListener('start',()=>{S.camPos=null;});\n\n/* ---------- loop ---------- */\nconst clock=new THREE.Clock();\nconst tmp=new THREE.Vector3(), proj=new THREE.Vector3();\nfunction resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}\nfunction angLerp(a,b,k){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k;}\nlet lastBody=-1;\nfunction frame(){\n  const dt=Math.min(clock.getDelta(),0.05), t=clock.getElapsedTime();\n  resize();\n  // environment\n  const nightK=S.night?1:0;\n  scene.background.lerp(S.studio?BG_STUDIO:(S.night?BG_NIGHT:BG_DAY),Math.min(1,dt*3));\n  hemi.intensity+=((S.night?0.18:0.75)-hemi.intensity)*Math.min(1,dt*3);\n  sun.intensity+=((S.night?0.05:0.9)-sun.intensity)*Math.min(1,dt*3);\n  lampLight.intensity+=((S.night?0.7:0)-lampLight.intensity)*Math.min(1,dt*3);\n  nightLight.intensity+=((S.night?1.4:0)-nightLight.intensity)*Math.min(1,dt*3);\n  shadeM.emissiveIntensity=lampLight.intensity*0.6;\n  winM.color.lerp(new THREE.Color(S.night?'#2A3A55':'#CFE3EC'),Math.min(1,dt*3));\n  // night cleaning\n  if(S.cleaning){\n    let left=0;dust.children.forEach(d=>{if(d.visible){const dx=d.position.x-robot.position.x,dz=d.position.z-robot.position.z;if(dx*dx+dz*dz<0.26*0.26)d.visible=false;else left++;}});\n    R.data.pct=1-left/dust.children.length;\n    brushes.forEach((b,i)=>{b.visible=true;b.rotation.y+=dt*(i?-14:14);});\n    if(R.data.pct>=0.97&&!R.data.done){R.data.done=true;R.data.pct=1;dust.children.forEach(d=>d.visible=false);S.cleaning=false;S.patrol=null;S.goal=DOCK.clone();S.look=V(1.35,0,2);brushes.forEach(b=>b.visible=false);\n      later(()=>toast('Đêm nay mẹ ngủ yên','Mẹ ngủ từ 22:10, không có gì bất thường. Nhà đã dọn xong lúc 02:47, COCC đã về đế sạc.','02:47'),1200);}\n  }\n  // patrol\n  if(S.patrol){if(robot.position.distanceTo(S.patrol[S.pi])<0.12){S.pi=(S.pi+1)%S.patrol.length;}S.goal.copy(S.patrol[S.pi]);}\n  // move robot\n  if(!S.studio){\n    if(!S.plannedFor||!S.plannedFor.equals(S.goal)||S.fallPlanned!==(S.fall>0)){S.route=plan(robot.position,S.goal);S.plannedFor=S.goal.clone();S.fallPlanned=(S.fall>0);}\n    while(S.route.length>1&&Math.hypot(S.route[0].x-robot.position.x,S.route[0].z-robot.position.z)<0.08)S.route.shift();\n    const wp=S.route[0]||S.goal;\n    tmp.set(wp.x-robot.position.x,0,wp.z-robot.position.z);const dist=tmp.length();\n    const last=S.route.length<=1;\n    const speed=S.night?0.42:0.55;\n    if(dist>0.02){tmp.normalize();const moveHead=Math.atan2(tmp.x,tmp.z);\n      const diff=Math.abs(angLerp(0,moveHead-robot.rotation.y,1));\n      robot.rotation.y=angLerp(robot.rotation.y,moveHead,Math.min(1,dt*4));\n      const turnK=Math.max(0.1,Math.cos(Math.min(diff,1.45)));\n      const step=Math.min(dist,speed*dt*turnK*(last?Math.min(1,dist*2.2+0.25):1));\n      robot.position.addScaledVector(tmp,step);\n      robot.position.y=Math.sin(t*9)*0.002;}\n    else if(S.look){const h=Math.atan2(S.look.x-robot.position.x,S.look.z-robot.position.z);robot.rotation.y=angLerp(robot.rotation.y,h,Math.min(1,dt*3));}\n  }else{\n    robot.position.lerp(V(0,0,0),Math.min(1,dt*4));\n    if(S.spin)robot.rotation.y+=dt*0.45;\n  }\n  head.rotation.x=Math.sin(t*1.3)*0.035+(R.mood==='alert'?0.12:0)+(R.mood==='sleep'?0.08:0);\n  head.rotation.z=R.mood==='listen'?Math.sin(t*1.1)*0.06:0;\n  // ring\n  ringMat.color.set(R.ring);ringMat.emissive.set(R.ring);ringMat.emissiveIntensity=R.mood==='alert'?(0.6+Math.abs(Math.sin(t*6))*1.2):(S.night?0.5:1.1);\n  // fall\n  if(S.fall>0&&S.fall<1){S.fall=Math.min(1,S.fall+dt*1.6);const k=S.fall*S.fall;baStand.rotation.x=-k*Math.PI/2*0.97;baStand.position.y=k*0.12;}\n  // screens\n  drawFace(t);\n  const bt=Math.floor(t*4);if(bt!==lastBody){lastBody=bt;drawBody(t);}\n  // camera\n  if(S.camPos){camera.position.lerp(S.camPos,Math.min(1,dt*1.8));controls.target.lerp(S.camTarget,Math.min(1,dt*1.8));if(camera.position.distanceTo(S.camPos)<0.02)S.camPos=null;}\n  else if(!S.studio&&!S.night){/* keep user's view */}\n  controls.update();\n  renderer.render(scene,camera);\n  // labels\n  const w=canvas.clientWidth,h=canvas.clientHeight;\n  anchors.forEach(({o,d})=>{\n    if(!showLabels||S.night){d.hidden=true;return;}\n    o.getWorldPosition(proj);\n    const toCam=tmp.copy(camera.position).sub(proj);\n    const dotRobot=toCam.dot(proj.clone().sub(robot.position).setY(0));\n    proj.project(camera);\n    const vis=proj.z<1&&Math.abs(proj.x)<1&&Math.abs(proj.y)<1&&dotRobot>-0.02;\n    d.hidden=!vis;if(vis){d.style.left=((proj.x+1)/2*w)+'px';d.style.top=((1-proj.y)/2*h)+'px';}\n  });\n  requestAnimationFrame(frame);\n}\ngo(0);\nframe();\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
